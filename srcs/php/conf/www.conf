[www]
; L'utilisateur et le groupe qui exécutent PHP-FPM
user = nobody
group = nobody

; Écouter sur toutes les interfaces sur le port 9000
; Cela permet à Nginx de se connecter depuis un autre conteneur
listen = 0.0.0.0:9000

; Nombre de processus enfants
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Nettoyer l'environnement au démarrage
clear_env = no
